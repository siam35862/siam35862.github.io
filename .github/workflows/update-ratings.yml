name: Update ratings
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-ratings
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install headless browser (CodeChef fallback)
        continue-on-error: true
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Fetch ratings
        run: python scripts/update_ratings.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ratings.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update ratings"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "Push failed, retrying ($i)"; sleep 3
          done
          exit 1
